<!-- @dsCard group="Colors" viewport="700x170" name="NEWS sections" subtitle="Four muted hues, one per section" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row">
<div style="flex:1;min-width:140px;border-left:3px solid var(--sec-thread);padding:4px 0 4px 12px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-kicker);text-transform:uppercase;color:var(--sec-thread)">▾ The week in one thread</div><div style="font-size:21px;font-weight:600;line-height:1.2;margin-top:6px">Key <span style="color:var(--sec-thread-ink)">phrase</span></div><div class="k">--sec-thread</div></div><div style="flex:1;min-width:140px;border-left:3px solid var(--sec-learning);padding:4px 0 4px 12px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-kicker);text-transform:uppercase;color:var(--sec-learning)">▾ Learning for the week</div><div style="font-size:21px;font-weight:600;line-height:1.2;margin-top:6px">Key <span style="color:var(--sec-learning-ink)">phrase</span></div><div class="k">--sec-learning</div></div><div style="flex:1;min-width:140px;border-left:3px solid var(--sec-stories);padding:4px 0 4px 12px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-kicker);text-transform:uppercase;color:var(--sec-stories)">▾ This week's stories</div><div style="font-size:21px;font-weight:600;line-height:1.2;margin-top:6px">Key <span style="color:var(--sec-stories-ink)">phrase</span></div><div class="k">--sec-stories</div></div><div style="flex:1;min-width:140px;border-left:3px solid var(--sec-leaders);padding:4px 0 4px 12px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-kicker);text-transform:uppercase;color:var(--sec-leaders)">▾ Industry leaders</div><div style="font-size:21px;font-weight:600;line-height:1.2;margin-top:6px">Key <span style="color:var(--sec-leaders-ink)">phrase</span></div><div class="k">--sec-leaders</div></div>
</div></body></html>
