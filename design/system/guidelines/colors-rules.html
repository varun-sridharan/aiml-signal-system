<!-- @dsCard group="Colors" viewport="700x150" name="Rules" subtitle="Hairlines separate everything" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--rule)"></div><div class="n">Rule</div><div class="k">--rule</div></div><div class="sw"><div class="chip" style="background:var(--rule2)"></div><div class="n">Rule soft</div><div class="k">--rule2</div></div><div class="sw"><div class="chip" style="background:var(--rule-strong)"></div><div class="n">Rule strong</div><div class="k">--rule-strong</div></div><div class="sw"><div class="chip" style="background:var(--rule-dotted)"></div><div class="n">Dotted</div><div class="k">--rule-dotted</div></div></div></body></html>
