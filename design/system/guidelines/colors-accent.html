<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="Burnt amber, the one brand colour" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">Accent</div><div class="k">--accent</div></div><div class="sw"><div class="chip" style="background:var(--accent-ink)"></div><div class="n">Accent ink</div><div class="k">--accent-ink</div></div><div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="n">Accent soft</div><div class="k">--accent-soft</div></div></div></body></html>
