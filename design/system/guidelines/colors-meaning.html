<!-- @dsCard group="Colors" viewport="700x260" name="Meaning" subtitle="Verified, miss, in progress, vote confirmation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ok)"></div><div class="n">Verified</div><div class="k">--ok</div></div><div class="sw"><div class="chip" style="background:var(--ok-soft)"></div><div class="n">Verified soft</div><div class="k">--ok-soft</div></div><div class="sw"><div class="chip" style="background:var(--miss)"></div><div class="n">Miss</div><div class="k">--miss</div></div><div class="sw"><div class="chip" style="background:var(--miss-soft)"></div><div class="n">Miss soft</div><div class="k">--miss-soft</div></div><div class="sw"><div class="chip" style="background:var(--active)"></div><div class="n">In progress</div><div class="k">--active</div></div><div class="sw"><div class="chip" style="background:var(--active-soft)"></div><div class="n">Active soft</div><div class="k">--active-soft</div></div></div>
<div style="margin-top:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div style="border:1px solid var(--ok-notice-border);background:var(--ok-notice-bg);color:var(--ok);border-radius:var(--radius-md);padding:10px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.04em">&#10003; Thanks, your vote is saved</div><div class="k" style="margin:0">--ok-notice-border #C4D6CB · --ok-notice-bg #EAF1EC · text --ok</div></div></body></html>
