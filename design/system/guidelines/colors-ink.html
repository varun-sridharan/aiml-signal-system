<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Five steps from headline to structure" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="n">Ink</div><div class="k">--ink</div></div><div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="n">Prose</div><div class="k">--ink-2</div></div><div class="sw"><div class="chip" style="background:var(--soft)"></div><div class="n">Soft</div><div class="k">--soft</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">Muted</div><div class="k">--muted</div></div><div class="sw"><div class="chip" style="background:var(--faint)"></div><div class="n">Faint</div><div class="k">--faint</div></div></div></body></html>
