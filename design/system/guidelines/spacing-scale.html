<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">4</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">5</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">6</div></div><div style="text-align:center"><div style="width:var(--space-7);height:var(--space-7);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">7</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent-soft);border:1px solid var(--accent)"></div><div class="k">8</div></div></div></body></html>
