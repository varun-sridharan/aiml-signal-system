<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div class="row" style="align-items:center">
<div style="text-align:center"><div style="width:64px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--radius-xs);background:var(--panel)"></div><div class="k">2</div></div><div style="text-align:center"><div style="width:64px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--radius-sm);background:var(--panel)"></div><div class="k">3</div></div><div style="text-align:center"><div style="width:64px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--radius-md);background:var(--panel)"></div><div class="k">4</div></div><div style="text-align:center"><div style="width:64px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--radius-lg);background:var(--panel)"></div><div class="k">6</div></div><div style="text-align:center"><div style="width:64px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--radius-pill);background:var(--panel)"></div><div class="k">pill</div></div>
<div style="flex:1;min-width:150px"><div style="border-top:1px solid var(--rule);margin:8px 0"></div><div style="border-top:1px solid var(--ink);margin:8px 0"></div><div style="width:44px;border-top:2px solid var(--accent);margin:8px 0"></div><div class="k">hairline · strong · accent rule</div></div></div></body></html>
