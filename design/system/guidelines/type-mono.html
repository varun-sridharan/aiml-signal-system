<!-- @dsCard group="Type" viewport="700x140" name="Mono labels" subtitle="IBM Plex Mono, small caps, wide tracking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--paper);padding:20px 24px;margin:0;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px;line-height:1.4}
.n{font-family:var(--mono);font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px;font-family:var(--mono);text-transform:uppercase">
<span style="font-size:10.5px;letter-spacing:var(--track-kicker);color:var(--accent)">Learning for the week</span>
<span style="font-size:11px;letter-spacing:var(--track-label);color:var(--muted)">Edition 09 · Oct-17-2026 to Oct-23-2026</span>
<span style="font-size:var(--fs-read-number);letter-spacing:0;color:var(--faint);text-transform:none">01/</span></div></body></html>
